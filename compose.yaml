services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kapibala
      POSTGRES_PASSWORD: kapibala
      POSTGRES_DB: kapibala
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["platform_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapibala"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  platform_db:
